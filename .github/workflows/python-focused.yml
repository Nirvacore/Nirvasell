name: Python focused maintenance

on:
  pull_request:
    paths:
      - ".github/workflows/python-focused.yml"
      - "db.py"
      - "order_import.py"
      - "pick_pack.py"
      - "pages/F_📈_Dashboard.py"
      - "test_expense_date_consistency.py"
      - "test_order_import_schema_extraction.py"

permissions:
  contents: read

jobs:
  order-import:
    name: Order import and SQLite migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run focused maintenance tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python test_order_import_schema_extraction.py
          python test_expense_date_consistency.py

      - name: Compile changed Python entry points
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile \
            db.py \
            order_import.py \
            pick_pack.py \
            "pages/F_📈_Dashboard.py" \
            test_order_import_schema_extraction.py \
            test_expense_date_consistency.py
