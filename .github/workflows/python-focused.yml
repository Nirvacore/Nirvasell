permissions:
  contents: read

jobs:
  order-import:
    name: Order import and SQLite migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Run focused maintenance tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python test_order_import_schema_extraction.py
          python test_order_business_date_contract.py
          python test_auth_require_auth_compat.py
          python test_cash_flow_canonical_evidence.py
          python test_cash_flow_page_contract.py
