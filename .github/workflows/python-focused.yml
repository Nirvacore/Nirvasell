name: Python focused maintenance

on:
  pull_request:
    paths:
      - ".github/workflows/python-focused.yml"
      - "db.py"
      - "expenses.py"
      - "budget_tracker.py"
      - "cash_flow.py"
      - "biz_health.py"
      - "alerts.py"
      - "kpi_scorecard.py"
      - "customers.py"
      - "customer_crm.py"
      - "customer_segments.py"
      - "shop_settings.py"
      - "user_settings.py"
      - "supplier_mgmt.py"
      - "supplier_directory.py"
      - "purchase_orders.py"
      - "tax_report.py"
      - "supplier_score.py"
      - "order_import.py"
      - "pick_pack.py"
      - "global_search.py"
      - "goal_tracker.py"
      - "clv.py"
      - "export_center.py"
      - "pages/A2_🔎_Search.py"
      - "pages/0_🚀_Start.py"
      - "pages/C9_🎯_Goals.py"
      - "pages/D9_🌟_Influencers.py"
      - "pages/E0_⚡_FlashSale.py"
      - "pages/E8_🎯_RFM.py"
      - "pages/D_🔀_Sourcing.py"
      - "pages/E_📋_Policies.py"
      - "pages/l_🔤_ABC.py"
      - "pages/F_📈_Dashboard.py"
      - "pages/b_🏭_Suppliers.py"
      - "pages/z_📇_CRM.py"
      - "pages/a_🚚_Shipping.py"
      - "pages/G5_📝_Notes.py"
      - "test_expense_date_consistency.py"
      - "test_customer_helper_rowid.py"
      - "test_customer_notes_schema.py"
      - "test_crm_page_order_total.py"
      - "test_shipping_page_carrier_names.py"
      - "test_notes_page_open_kpi.py"
      - "test_notes_page_pinned_create.py"
      - "test_settings_supplier_schema_migrations.py"
      - "test_tax_report_quarterly.py"
      - "test_supplier_score_logic.py"
      - "test_alerts_product_schema.py"
      - "test_global_search_order_schema.py"
      - "test_search_page_order_total.py"
      - "test_goals_page_period_options.py"
      - "test_clv_order_schema.py"
      - "test_export_orders_schema.py"
      - "test_export_expenses_schema.py"
      - "test_influencer_page_commission_options.py"
      - "test_flashsale_page_discount_options.py"
      - "test_rfm_page_average_spent.py"
      - "test_abc_page_advice_render.py"
      - "test_sourcing_page_header.py"
      - "test_policies_page_header.py"
      - "test_start_page_header.py"
      - "test_order_import_schema_extraction.py"

permissions:
  contents: read

jobs:
  order-import:
    name: Order import and SQLite migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Run focused maintenance tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python test_order_import_schema_extraction.py
          python test_expense_date_consistency.py
          python test_customer_helper_rowid.py
          python test_customer_notes_schema.py
          python test_crm_page_order_total.py
          python test_shipping_page_carrier_names.py
          python test_notes_page_open_kpi.py
          python test_notes_page_pinned_create.py
          python test_settings_supplier_schema_migrations.py
          python test_tax_report_quarterly.py
          python test_supplier_score_logic.py
          python test_alerts_product_schema.py
          python test_global_search_order_schema.py
          python test_search_page_order_total.py
          python test_goals_page_period_options.py
          python test_clv_order_schema.py
          python test_export_orders_schema.py
          python test_export_expenses_schema.py
          python test_influencer_page_commission_options.py
          python test_flashsale_page_discount_options.py
          python test_rfm_page_average_spent.py
          python test_abc_page_advice_render.py
          python test_sourcing_page_header.py
          python test_policies_page_header.py
          python test_start_page_header.py

      - name: Compile changed Python entry points
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile \
            db.py \
            customers.py \
            customer_crm.py \
            customer_segments.py \
            shop_settings.py \
            user_settings.py \
            supplier_mgmt.py \
            supplier_directory.py \
            purchase_orders.py \
            tax_report.py \
            supplier_score.py \
            alerts.py \
            order_import.py \
            pick_pack.py \
            global_search.py \
            goal_tracker.py \
            clv.py \
            export_center.py \
            "pages/A2_🔎_Search.py" \
            "pages/0_🚀_Start.py" \
            "pages/C9_🎯_Goals.py" \
            "pages/D9_🌟_Influencers.py" \
            "pages/E0_⚡_FlashSale.py" \
            "pages/E8_🎯_RFM.py" \
            "pages/D_🔀_Sourcing.py" \
            "pages/E_📋_Policies.py" \
            "pages/l_🔤_ABC.py" \
            "pages/F_📈_Dashboard.py" \
            "pages/b_🏭_Suppliers.py" \
            "pages/z_📇_CRM.py" \
            "pages/a_🚚_Shipping.py" \
            "pages/G5_📝_Notes.py" \
            test_order_import_schema_extraction.py \
            test_expense_date_consistency.py \
            test_customer_helper_rowid.py \
            test_customer_notes_schema.py \
            test_crm_page_order_total.py \
            test_shipping_page_carrier_names.py \
            test_notes_page_open_kpi.py \
            test_notes_page_pinned_create.py \
            test_settings_supplier_schema_migrations.py \
            test_tax_report_quarterly.py \
            test_supplier_score_logic.py \
            test_alerts_product_schema.py \
            test_global_search_order_schema.py \
            test_search_page_order_total.py \
            test_goals_page_period_options.py \
            test_clv_order_schema.py \
            test_export_orders_schema.py \
            test_export_expenses_schema.py \
            test_influencer_page_commission_options.py \
            test_flashsale_page_discount_options.py \
            test_rfm_page_average_spent.py \
            test_abc_page_advice_render.py \
            test_sourcing_page_header.py \
            test_policies_page_header.py \
            test_start_page_header.py
